on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set temporary paths
        run: |
          echo "CUTOVER_BACKUP_DIR=$RUNNER_TEMP/concertboxd-backup" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Check application
        working-directory: app
        run: |
          npm run lint
          npx tsx --test src/app_x/tests/model.test.ts src/app_x/tests/exports.test.ts src/app_x/tests/session.test.ts src/app_x/tests/schedules.test.ts src/app_x/tests/cleanSchema.test.ts src/app_x/tests/songLists.test.ts src/app_x/tests/firestoreRest.test.ts src/app_x/tests/catalogCorrections.test.ts
      - name: Check music caches
        run: python3 -m unittest discover -s app/src/app_x/tests -p 'test_*.py'
      - run: bash .github/workflows/record_sha.sh
      - run: npm run build
        working-directory: app
      - name: Stage Hosting files under Firebase config directory
        working-directory: app
        run: cp -R dist src/app_x/backend/hosting-dist
      - name: Authenticate Concertboxd deployment
        uses: google-github-actions/auth@v3
        with:
          project_id: concertboxd
          workload_identity_provider: projects/565493109366/locations/global/workloadIdentityPools/github/providers/github
          service_account: deployer-github@concertboxd.iam.gserviceaccount.com
      - name: Back up and verify migrated database
        working-directory: app
        run: npx tsx src/app_x/scripts/backupProduction.ts
      - name: Preserve database backup before writes
        uses: actions/upload-artifact@v4
        with:
          name: database-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CUTOVER_BACKUP_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Deploy access rules and index exemptions
        working-directory: app
        run: npx firebase deploy --project concertboxd --config src/app_x/backend/firebase.production.json --only firestore --non-interactive
      - name: Deploy application
        working-directory: app
        run: npx firebase deploy --project concertboxd --config src/app_x/backend/firebase.production.json --only hosting --non-interactive
      - name: Verify deployed app and public data
        working-directory: app
        run: npx tsx src/app_x/scripts/verifyProduction.ts
      - name: Preserve deployment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CUTOVER_BACKUP_DIR }}
          if-no-files-found: ignore
          retention-days: 90
